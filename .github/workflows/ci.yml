name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Runners ship API 37 as platforms/android-37.0; AGP still looks up android-37
      # unless minorApiLevel is set. Keep a folder alias for aapt/lint as well.
      - name: Ensure Android API 37.0 platform
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          mkdir -p "$ANDROID_HOME/platforms"
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            sdkmanager "platforms;android-37.0"
          fi
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # I2: single mandatory gate — ktlint, Android Lint, JVM unit tests
      # of every module. B3/B6 tests enter here automatically; do not add
      # a second `test` command.
      - name: Check
        run: |
          set -o pipefail
          ./gradlew check --stacktrace --console=plain | tee check.log

      # B3 / I3: regenerate seed with the same CLI as local builds and
      # fail if committed assets or frozen config drifted.
      - name: Generate and verify committed seed
        run: |
          ./gradlew :seed-generator:generateSeed
          git diff --exit-code -- \
            app/src/main/assets/seed/ \
            seed-data/categorization-config.json \
            seed-data/reports/seed-v1-validation.json

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # I3 / ТЗ §9.3: debug APK на вкладке Releases только с зелёного main.
      - name: Publish debug APK to Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug-apk
          name: Debug APK
          target_commitish: ${{ github.sha }}
          body: |
            Debug-сборка `${{ github.sha }}` с ветки `main`.
            Подпись — стандартный debug keystore раннера CI.
            Релизный ключ и публикация в магазины не настраиваются.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            check.log
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/ktlint/
            **/build/reports/lint-results*.html
          retention-days: 7
          if-no-files-found: ignore
