name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # I2: single mandatory gate — ktlint, Android Lint, JVM unit tests
      # of every module. B3/B6 tests enter here automatically; do not add
      # a second `test` command.
      - name: Check
        run: ./gradlew check

      # B3 / I3: regenerate seed with the same CLI as local builds and
      # fail if committed assets or frozen config drifted.
      - name: Generate and verify committed seed
        run: |
          ./gradlew :seed-generator:generateSeed
          git diff --exit-code -- \
            app/src/main/assets/seed/ \
            seed-data/categorization-config.json \
            seed-data/reports/seed-v1-validation.json

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/ktlint/
            **/build/reports/lint-results*.html
          retention-days: 7
          if-no-files-found: ignore
